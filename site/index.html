<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5F5F3">
<title>RevoSell — скидки магазинов Турции</title>
<meta name="description" content="RevoSell: скидки и акции BİM, ŞOK и Migros в одном месте.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23D7FF00%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22900%22%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --mint:#C5E2DF; --lime:#D7FF00; --ink:#000000;
  --text:#111111; --muted:#7A7D86; --shadow:0 6px 24px rgba(17,17,17,.06);
  --r-xl:28px; --r-lg:22px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:24px}
button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit;border:0;outline:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo-mark{width:44px;height:44px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:22px}
.logo-name{font-family:Archivo,Inter,sans-serif;font-stretch:80%;font-weight:900;font-size:1.45rem;text-transform:uppercase}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.circle{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
.lang{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.lang button{padding:7px 12px;border-radius:999px;font-weight:600;font-size:.82rem;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--mint);color:var(--ink)}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:4px 4px 4px 16px;box-shadow:var(--shadow)}
.search>i{font-size:20px}
.search input{flex:1;min-width:0;padding:8px 0}
.search input::placeholder{color:#A3A6AE}
.lime-btn{width:40px;height:40px;flex:none;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:20px;color:var(--ink)}
.lime-btn.sm{width:38px;height:38px;font-size:18px}
.sheet{display:none;gap:8px;flex-wrap:wrap;padding:12px 0 0}
.sheet.open{display:flex}

h1{font-family:Archivo,Inter,sans-serif;font-stretch:78%;font-weight:900;font-size:clamp(2.1rem,7vw,3.4rem);line-height:.95;text-transform:uppercase;margin:26px 0 8px}
.meta{color:var(--muted);font-size:.82rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .dot{width:4px;height:4px;border-radius:50%;background:#C3C5CC}
.meta .warn{color:#8a5a00}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:500;font-size:.84rem;white-space:nowrap;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed=true]{background:var(--mint)}
.chip[aria-pressed=true] small{color:#3d5553}
.chip.store[aria-pressed=true]{background:var(--ink);color:#fff}
.chip.store[aria-pressed=true] small{color:#c9cbd1}
.chip select{appearance:none;-webkit-appearance:none;padding-right:4px;max-width:58vw}

.count{color:var(--muted);font-size:.8rem;padding:10px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r-xl);padding:10px;display:flex;flex-direction:column;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.pic{position:relative;border-radius:var(--r-lg);background:#fff;aspect-ratio:1/1;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--lime);color:var(--ink);font-weight:700;font-size:.8rem;border-radius:999px;padding:5px 10px}
.storetag{position:absolute;top:10px;right:10px;background:var(--surface);color:var(--ink);font-weight:700;font-size:.72rem;border-radius:999px;padding:5px 9px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.body{padding:10px 6px 4px;display:flex;flex-direction:column;gap:2px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tag{display:flex;align-items:center;gap:4px;background:var(--mint);border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:600;color:#26403e}
.tag.soon{background:#FFF7C2;color:#5c5200}
.tag.money{background:#EFE6FF;color:#4a2a8a}
.tag.promo{background:var(--lime);color:var(--ink)}
.brand{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.name{font-weight:700;line-height:1.25;font-size:.95rem}
.qty{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:auto;padding-top:10px}
.prices{display:flex;flex-direction:column;line-height:1.1}
.price{font-family:Archivo,Inter,sans-serif;font-stretch:85%;font-weight:800;font-size:1.45rem}
.old{color:var(--muted);text-decoration:line-through;font-size:.85rem}
.row .lime-btn{margin-left:auto}
.empty{color:var(--muted);text-align:center;padding:60px 0;grid-column:1/-1}
.empty i{font-size:40px;display:block;margin-bottom:8px}
.more{display:block;margin:20px auto 0;background:var(--surface);border-radius:999px;padding:12px 22px;font-weight:600;box-shadow:var(--shadow)}

.about{display:none;background:var(--surface);border-radius:var(--r-lg);padding:16px 18px;margin-top:14px;box-shadow:var(--shadow);font-size:.88rem;color:#3b3e45}
.about.open{display:block}
.about b{color:var(--ink)}
footer{color:var(--muted);font-size:.78rem;padding:28px 0 8px;text-align:center}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));height:68px;background:var(--mint);border-radius:26px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:10;box-shadow:0 10px 30px rgba(17,17,17,.12)}
.nav button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#1b2b2a}
.nav button.center{width:64px;height:64px;margin-top:-34px;background:var(--lime);font-size:26px;box-shadow:0 0 0 8px var(--bg)}
.nav button[aria-current=true]:not(.center){background:rgba(255,255,255,.6)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:520px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:7px;border-radius:22px}
  .pic{border-radius:17px}
  .body{padding:8px 4px 2px}
  .name{font-size:.86rem}
  .price{font-size:1.2rem}
  .lime-btn.sm{width:34px;height:34px;font-size:16px}
  .logo-name{font-size:1.25rem}
  .circle,.logo-mark{width:40px;height:40px}
  .storetag{font-size:.66rem;padding:4px 7px}
  .badge{font-size:.74rem;padding:4px 8px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="logo" href="./"><span class="logo-mark"><i class="ph-bold ph-tag"></i></span><span class="logo-name">RevoSell</span></a>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Язык">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="tr">TR</button>
      </div>
    </div>
  </header>

  <label class="search">
    <i class="ph ph-magnifying-glass"></i>
    <input id="q" type="search" autocomplete="off">
    <button class="lime-btn" type="button" id="sortBtn" aria-label="Сортировка"><i class="ph-bold ph-sliders-horizontal"></i></button>
  </label>
  <div class="sheet" id="sortsheet"></div>
  <nav class="chips" id="stores"></nav>
  <nav class="chips" id="chips"></nav>
  <div class="count" id="count"></div>
  <section class="grid" id="grid"></section>
  <button class="more" type="button" id="more" hidden></button>
  <footer id="footer"></footer>
</main>


<script>
const I18N = {
  ru: {
    title: 'Лови скидки<br>недели', search: 'Найти товар или бренд…', allStores: 'Все магазины',
    deals: 'Все акции', soon: 'Скоро', category: 'Все категории',
    types: { discount: 'Скидки %', card: 'С картой Money', multi: '2 по цене 1 и т.п.', basket: 'Цена в корзине', cashback: 'Кэшбэк', clearance: 'Распродажа', catalog: 'Каталог акций', goodprice: 'Выгодная цена', promo: 'Другие акции' },
    products: (n) => `${n.toLocaleString('ru-RU')} ${plural(n, ['товар', 'товара', 'товаров'])}`, updated: 'обновлено',
    stale: 'данные не обновились', more: 'Показать ещё',
    sort: { disc: 'Самая большая скидка', asc: 'Сначала дешёвые', desc: 'Сначала дорогие', name: 'По названию' },
    onSale: (d) => `В продаже с ${d}`, startsOn: (d) => `С ${d}`, until: (d) => `До ${d}`, from: (d) => `С ${d}`,
    money: 'С картой Money', empty: 'Ничего не найдено', error: 'Не удалось загрузить данные. Попробуйте позже.',
    nav: { 'all-products': 'Все товары', deals: 'Скидки', home: 'Главная', soon: 'Скоро', search: 'Поиск' },
    about: '<b>RevoSell</b> собирает акции и цены магазинов Турции: <b>BİM</b> (Aktüel и İndirim), <b>ŞOK</b> (онлайн-каталог Market и Ekstra) и <b>Migros</b> (онлайн-магазин). Данные обновляются дважды в день и проверяются: цена, старая цена, фото и ссылка сверяются со страницей товара. У Migros скидочная цена действует <b>с бесплатной картой Money</b>. Цены и фото принадлежат магазинам, по клику открывается страница товара в магазине. В конкретном магазине цена может отличаться, количество ограничено.',
    footer: 'Источники: bim.com.tr · sokmarket.com.tr · migros.com.tr · цены и фото принадлежат магазинам · убрать данные: bezzimeni17@gmail.com',
    locale: 'ru-RU',
  },
  tr: {
    title: 'Haftanın<br>indirimleri', search: 'Ürün veya marka ara…', allStores: 'Tüm marketler',
    deals: 'Tüm fırsatlar', soon: 'Yakında', category: 'Tüm kategoriler',
    types: { discount: '% İndirim', card: "Money Kart'la", multi: 'Çoklu alım', basket: 'Sepette indirim', cashback: 'Para iade', clearance: 'Stok eritme', catalog: 'Kampanya kataloğu', goodprice: 'İyi fiyat', promo: 'Diğer kampanyalar' },
    products: (n) => `${n.toLocaleString('tr-TR')} ürün`, updated: 'güncellendi',
    stale: 'veri güncellenemedi', more: 'Daha fazla göster',
    sort: { disc: 'En çok indirim', asc: 'Önce ucuz', desc: 'Önce pahalı', name: 'Ada göre' },
    onSale: (d) => `${d} tarihinden beri satışta`, startsOn: (d) => `${d} tarihinde`, until: (d) => `${d} tarihine kadar`, from: (d) => `${d} tarihinden itibaren`,
    money: "Money Kart'la", empty: 'Sonuç bulunamadı', error: 'Veriler yüklenemedi. Lütfen daha sonra tekrar deneyin.',
    nav: { 'all-products': 'Tüm ürünler', deals: 'İndirim', home: 'Ana sayfa', soon: 'Yakında', search: 'Ara' },
    about: '<b>RevoSell</b> Türkiye marketlerinin kampanya ve fiyatlarını toplar: <b>BİM</b> (Aktüel ve İndirim), <b>ŞOK</b> (Market ve Ekstra online katalog) ve <b>Migros</b> (Sanal Market). Veriler günde iki kez güncellenir ve kontrol edilir: fiyat, eski fiyat, görsel ve link ürün sayfasıyla karşılaştırılır. Migros indirimli fiyatları <b>ücretsiz Money Kart</b> ile geçerlidir. Fiyat ve görseller marketlere aittir; tıklayınca marketin ürün sayfası açılır. Mağazadaki fiyat farklı olabilir, stoklarla sınırlıdır.',
    footer: 'Kaynaklar: bim.com.tr · sokmarket.com.tr · migros.com.tr · fiyat ve görseller marketlere aittir · kaldırma talebi: bezzimeni17@gmail.com',
    locale: 'tr-TR',
  },
};
function plural(n, f) { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2]; }

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const icon = (name, w = 'ph') => el('i', `${w} ph-${name}`);
// Search ignores case and Turkish letters: "cikolata" finds "Çikolata".
const fold = (s) => (s || '').toLocaleLowerCase('tr').replace(/[çğıöşüâî]/g, (c) => ({ ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u', â: 'a', î: 'i' }[c]));
const todayIso = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Istanbul' });
const PAGE = 48;

const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let lang = store.get('lang') || ((navigator.language || '').startsWith('tr') ? 'tr' : 'ru');
const state = { store: 'all', mode: 'deals', type: null, period: null, category: '', sort: 'disc', shown: PAGE };
let DATA = null, STORES = {}, current = [];
const T = () => I18N[lang];

const dayFmt = () => new Intl.DateTimeFormat(T().locale, { day: 'numeric', month: 'short', timeZone: 'UTC' });
const weekFmt = () => new Intl.DateTimeFormat(T().locale, { day: 'numeric', month: 'short', weekday: 'short', timeZone: 'UTC' });
const d = (iso) => dayFmt().format(new Date(iso + 'T00:00:00Z'));
const money = (n) => new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 2 }).format(n) + ' ₺';
const abs = (rel, base) => (rel == null ? null : rel.startsWith('!') ? rel.slice(1) : base + rel);

const expired = (p) => p.vt && p.vt < todayIso;
const future = (p) => p.vf && p.vf > todayIso;

function matches(p) {
  if (expired(p)) return false;
  if (state.store !== 'all' && p.s !== state.store) return false;
  if (state.mode === 'type' && !p.t.includes(state.type)) return false;
  if (state.mode === 'soon' && !future(p)) return false;
  if (state.mode === 'period' && p.pk !== state.period) return false;
  if (state.category && p.c !== state.category) return false;
  return true;
}

function renderStatic() {
  document.documentElement.lang = lang;
  $('q').placeholder = T().search;
  $('footer').textContent = T().footer;
  $('more').textContent = T().more;
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('sortsheet').replaceChildren(...Object.entries(T().sort).map(([k, label]) => {
    const b = el('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', k === state.sort);
    b.onclick = () => { state.sort = k; renderStatic(); render(); };
    return b;
  }));
}

function chip(label, n, pressed, onclick, cls = 'chip') {
  const b = el('button', cls, label); b.type = 'button';
  if (n != null) b.append(el('small', '', n.toLocaleString(T().locale)));
  b.setAttribute('aria-pressed', pressed); b.onclick = onclick;
  return b;
}

function renderChips() {
  const live = DATA.products.filter((p) => !expired(p));
  const inMode = (p) => state.mode === 'type' ? p.t.includes(state.type) : state.mode === 'soon' ? future(p) : true;
  $('stores').replaceChildren(
    chip(T().allStores, live.filter(inMode).length, state.store === 'all', () => setStore('all'), 'chip store'),
    ...DATA.stores.map((s) => chip(s.name, live.filter((p) => p.s === s.id && inMode(p)).length, state.store === s.id, () => setStore(s.id), 'chip store')));

  // deal-type row
  const scope = live.filter((p) => state.store === 'all' || p.s === state.store);
  const tabs = [chip(T().deals, scope.length, state.mode === 'deals', () => setMode('deals'))];
  for (const [t, label] of Object.entries(T().types)) {
    const n = scope.filter((p) => p.t.includes(t)).length;
    if (n) tabs.push(chip(label, n, state.mode === 'type' && state.type === t, () => { state.type = t; setMode('type'); }));
  }
  const soonN = scope.filter(future).length;
  if (soonN) tabs.push(chip(T().soon, soonN, state.mode === 'soon', () => setMode('soon')));
  if (state.store === 'bim') {
    for (const per of DATA.periods.filter((x) => x.section === 'aktuel' && x.validFrom).sort((a, b) => a.validFrom.localeCompare(b.validFrom))) {
      const n = scope.filter((p) => p.pk === per.key).length;
      if (n) tabs.push(chip(weekFmt().format(new Date(per.validFrom + 'T00:00:00Z')), n, state.mode === 'period' && state.period === per.key, () => { state.period = per.key; setMode('period'); }));
    }
  }
  // category picker
  const cats = new Map();
  for (const p of scope) if (p.c && matchesMode(p)) cats.set(p.c, (cats.get(p.c) || 0) + 1);
  if (cats.size > 1) {
    const wrap = el('label', 'chip'); wrap.setAttribute('aria-pressed', !!state.category);
    wrap.append(icon('squares-four'));
    const sel = el('select'); sel.setAttribute('aria-label', T().category);
    sel.append(new Option(T().category, ''));
    [...cats.entries()].sort((a, b) => a[0].localeCompare(b[0], 'tr')).forEach(([c, n]) => sel.append(new Option(`${c} (${n})`, c)));
    sel.value = cats.has(state.category) ? state.category : '';
    if (!cats.has(state.category)) state.category = '';
    sel.onchange = () => { state.category = sel.value; state.shown = PAGE; renderChips(); render(); };
    wrap.append(sel); tabs.push(wrap);
  } else state.category = '';
  $('chips').replaceChildren(...tabs);
}
function matchesMode(p) { const c = state.category; state.category = ''; const r = matches(p); state.category = c; return r; }

function tagsFor(p) {
  const out = [];
  if (p.s === 'bim') {
    if (future(p)) out.push(['soon', 'clock', p.t.includes('discount') ? T().from(d(p.vf)) : T().startsOn(d(p.vf))]);
    else out.push(['', 'check-circle', p.t.includes('discount') && p.vt ? T().until(d(p.vt)) : T().onSale(d(p.vf))]);
  }
  if (p.m === 'money') out.push(['money', 'credit-card', T().money]);
  for (const pr of p.pr || []) out.push(['promo', 'gift', pr]);
  return out;
}

function card(p) {
  const s = STORES[p.s];
  const a = el('a', 'card'); a.href = abs(p.u, s.url); a.target = '_blank'; a.rel = 'noopener';
  const pic = el('div', 'pic');
  const img = el('img'); img.loading = 'lazy'; img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
  img.src = abs(p.i, s.img); img.alt = [p.b, p.n].filter(Boolean).join(' ');
  pic.append(img);
  if (p.o) pic.append(el('span', 'badge', '−' + p.d + '%'));
  pic.append(el('span', 'storetag', s.name));
  const body = el('div', 'body');
  const tags = tagsFor(p);
  if (tags.length) {
    const t = el('div', 'tags');
    for (const [cls, ic, text] of tags) { const x = el('span', 'tag ' + cls); x.append(icon(ic, 'ph-bold'), document.createTextNode(text)); t.append(x); }
    body.append(t);
  }
  if (p.b) body.append(el('div', 'brand', p.b));
  body.append(el('div', 'name', p.n));
  if (p.q) { const q = el('div', 'qty'); q.append(icon('package'), document.createTextNode(p.q)); body.append(q); }
  const row = el('div', 'row'); const pr = el('div', 'prices');
  if (p.o) pr.append(el('span', 'old', money(p.o)));
  pr.append(el('span', 'price', money(p.p)));
  const go = el('span', 'lime-btn sm'); go.append(icon('arrow-right', 'ph-bold'));
  row.append(pr, go); body.append(row);
  a.append(pic, body);
  return a;
}

function render() {
  const q = fold($('q').value.trim());
  const words = q.split(/\s+/).filter(Boolean);
  const sorters = {
    disc: (a, b) => (b.d || 0) - (a.d || 0) || b.t.length - a.t.length || a.p - b.p,
    asc: (a, b) => a.p - b.p, desc: (a, b) => b.p - a.p,
    name: (a, b) => a.n.localeCompare(b.n, 'tr'),
  };
  current = DATA.products.filter((p) => matches(p) && (!words.length || words.every((w) => p._f.includes(w)))).sort(sorters[state.sort]);
  $('count').textContent = T().products(current.length);
  if (!current.length) {
    const e = el('div', 'empty'); e.append(icon('smiley-sad'), document.createTextNode(T().empty));
    $('grid').replaceChildren(e); $('more').hidden = true; return;
  }
  $('grid').replaceChildren(...current.slice(0, state.shown).map(card));
  $('more').hidden = current.length <= state.shown;
}

function showMore() {
  const from = state.shown; state.shown += PAGE;
  $('grid').append(...current.slice(from, state.shown).map(card));
  $('more').hidden = current.length <= state.shown;
}

function setStore(s) { state.store = s; state.shown = PAGE; if (state.mode === 'period' && s !== 'bim') state.mode = 'deals'; renderChips(); render(); }
function setMode(m) { state.mode = m; state.shown = PAGE; renderChips(); render(); window.scrollTo({ top: $('stores').offsetTop - 12 }); }

document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => { lang = b.dataset.lang; store.set('lang', lang); renderStatic(); if (DATA) { renderChips(); render(); } });
$('sortBtn').onclick = (e) => { e.preventDefault(); $('sortsheet').classList.toggle('open'); };
$('more').onclick = showMore;
let qTimer; $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { if (DATA) { state.shown = PAGE; render(); } }, 150); });
new IntersectionObserver((es) => { if (es[0].isIntersecting && !$('more').hidden) showMore(); }, { rootMargin: '600px' }).observe($('more'));

renderStatic();
fetch('data/products.json', { cache: 'no-cache' })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    DATA = data;
    for (const s of data.stores) STORES[s.id] = s;
    for (const p of data.products) p._f = fold(`${p.n} ${p.b || ''} ${p.c || ''} ${STORES[p.s].name}`);
    renderStatic(); renderChips(); render();
  })
  .catch(() => { const e = el('div', 'empty'); e.append(icon('wifi-slash'), document.createTextNode(T().error)); $('grid').replaceChildren(e); });
</script>
</body>
</html>
