<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5F5F3">
<title>RevoSell — скидки и акции магазинов</title>
<meta name="description" content="RevoSell: скидки и акции магазинов Турции и России в одном месте.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23D7FF00%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22900%22%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Only the two icon weights the page uses (the loader script pulls all six). -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="preconnect" href="https://images.migrosone.com">
<link rel="preconnect" href="https://images.ceptesok.com">
<link rel="preconnect" href="https://cdn1.bim.com.tr">
<link rel="preconnect" href="https://img.vkusvill.ru">
<link rel="preconnect" href="https://images-foodtech.magnit.ru">
<style>
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --mint:#C5E2DF; --lime:#D7FF00; --ink:#000000;
  --text:#111111; --muted:#7A7D86; --shadow:0 6px 24px rgba(17,17,17,.06);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:24px}
button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit;border:0;outline:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.logo-mark{width:40px;height:40px;flex:none;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:20px}
.logo-name{font-family:Archivo,Inter,sans-serif;font-stretch:80%;font-weight:900;font-size:1.3rem;text-transform:uppercase;white-space:nowrap}
.logo-store{font-family:Archivo,Inter,sans-serif;font-stretch:80%;font-weight:800;font-size:1.3rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{margin-left:auto;width:44px;height:44px;flex:none;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:4px 4px 4px 16px;box-shadow:var(--shadow)}
.search>i{font-size:20px}
.search input{flex:1;min-width:0;padding:8px 0}
.search input::placeholder{color:#A3A6AE}
.lime-btn{width:40px;height:40px;flex:none;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:20px;color:var(--ink)}
.lime-btn.sm{width:36px;height:36px;font-size:17px}
#sortBtn{position:relative}
.fbadge[hidden]{display:none}
.fbadge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;padding:0 4px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:500;font-size:.84rem;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed=true]{background:var(--mint)}
.chip[aria-pressed=true] small{color:#3d5553}
.chip select{appearance:none;-webkit-appearance:none;max-width:56vw}

.count{color:var(--muted);font-size:.8rem;padding:0 2px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.linkbtn{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border-radius:28px;padding:10px;display:flex;flex-direction:column;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.pic{position:relative;border-radius:22px;background:#fff;aspect-ratio:1/1;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--lime);color:var(--ink);font-weight:700;font-size:.8rem;border-radius:999px;padding:5px 10px}
.newbadge{position:absolute;bottom:10px;left:10px;background:var(--ink);color:var(--lime);font-weight:700;font-size:.7rem;border-radius:999px;padding:4px 9px;letter-spacing:.04em}
.storetag{position:absolute;top:10px;right:10px;background:var(--surface);color:var(--ink);font-weight:700;font-size:.72rem;border-radius:999px;padding:5px 9px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.body{padding:10px 6px 4px;display:flex;flex-direction:column;gap:2px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tag{display:flex;align-items:center;gap:4px;background:var(--mint);border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:600;color:#26403e}
.tag.soon{background:#FFF7C2;color:#5c5200}
.tag.end{background:#FFE4DE;color:#8a2a12}
.tag.money{background:#EFE6FF;color:#4a2a8a}
.tag.promo{background:var(--lime);color:var(--ink)}
.tag.seen{background:#ECECE8;color:#4b4e55}
.brand{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.name{font-weight:700;line-height:1.25;font-size:.95rem}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:auto;padding-top:10px}
.prices{display:flex;flex-direction:column;line-height:1.1}
.price{font-family:Archivo,Inter,sans-serif;font-stretch:85%;font-weight:800;font-size:1.45rem}
.old{color:var(--muted);text-decoration:line-through;font-size:.85rem}
.row .lime-btn{margin-left:auto}
.empty{color:var(--muted);text-align:center;padding:60px 0;grid-column:1/-1}
.empty i{font-size:40px;display:block;margin-bottom:8px}
.more{display:block;margin:20px auto 0;background:var(--surface);border-radius:999px;padding:12px 22px;font-weight:600;box-shadow:var(--shadow)}
footer{color:var(--muted);font-size:.75rem;padding:24px 0 8px;text-align:center}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20;display:none}
/* Closed menu parts are display:none: iOS Safari tints its top/bottom bars from
   fixed elements at the screen edges even when they are invisible. */
.drawer{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:min(360px,calc(100vw - 48px));background:var(--bg);z-index:21;border-radius:30px;padding:16px;display:none;flex-direction:column;gap:12px;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.18)}
body.menu .scrim{display:block;animation:fade .2s ease}
body.menu .drawer{display:flex;animation:slide .25s ease}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(calc(100% + 24px))}}
.drawer-head{display:flex;align-items:center;gap:10px}
.drawer-head .lang{margin-left:auto}
.drawer-head .burger{margin-left:0}
.drawer-head b{font-family:Archivo,Inter,sans-serif;font-stretch:80%;font-weight:900;font-size:1.2rem;text-transform:uppercase}
.store-list{display:flex;flex-direction:column;gap:8px}
.store-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:22px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
.store-btn[aria-current=true]{background:var(--ink);color:#fff}
.store-btn .ico{width:44px;height:44px;color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.store-btn .ico.all{background:var(--lime);border-radius:50%;box-shadow:none;font-size:22px}
.store-btn .ico img{width:100%;height:100%;object-fit:contain}
.store-btn .ico[data-store=vkusvill] img,.store-btn .ico[data-store=magnit] img{border-radius:12px} /* square app-icon logos */
.store-btn .info{flex:1;min-width:0}
.store-btn .nm{font-weight:700}
.store-btn .sub{font-size:.74rem;display:flex;align-items:center;gap:6px;color:var(--muted)}
.store-btn[aria-current=true] .sub{color:#c9cbd1}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:#2fbf71}.dot.warn{background:#f5b300}.dot.bad{background:#e5484d}
.store-btn .n{font-weight:700;font-size:.9rem}
.lang{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow);align-self:flex-start}
.lang button{white-space:nowrap;padding:7px 12px;border-radius:999px;font-weight:600;font-size:.82rem;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--mint);color:var(--ink)}
.drawer small{color:var(--muted);font-size:.75rem;line-height:1.4}

/* Filter panel: bottom sheet on phones, centred card on wide screens. */
.fsheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:30px 30px 0 0;max-height:min(88vh,88dvh);display:none;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
body.filters .scrim{display:block;animation:fade .2s ease}
body.filters .fsheet{display:flex;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
@media (min-width:700px){
  .fsheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:84vh;border-radius:30px;transform:translate(-50%,-50%)}
  body.filters .fsheet{animation:fade .2s ease}
}
.fs-head{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.fs-head b{font-family:Archivo,Inter,sans-serif;font-stretch:80%;font-weight:900;font-size:1.2rem;text-transform:uppercase}
.fs-head .burger{margin-left:auto}
.fs-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 8px;display:flex;flex-direction:column;gap:18px}
.fs-sec h4{margin:0 0 10px;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fs-sec h4 button{text-transform:none;letter-spacing:0;font-size:.78rem;color:var(--ink);font-weight:600}
.fs-sub{margin:12px 0 8px;font-size:.8rem;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fs-sub button{font-size:.78rem;font-weight:600;color:var(--muted)}
.fs-chips{display:flex;flex-wrap:wrap;gap:6px}
.fs-chips.line{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.fs-chips.line::-webkit-scrollbar{display:none}
.fs-chips .chip{padding:8px 12px}
.fs-chips .chip i{font-size:16px}
.fs-chips .chip[aria-pressed=true]{background:var(--ink);color:#fff}
.fs-chips .chip[aria-pressed=true] small{color:#c9cbd1}
.hist{display:flex;align-items:flex-end;gap:2px;height:36px;padding:0 13px}
.hist span{flex:1;background:#E3E3DF;border-radius:3px 3px 0 0;min-height:2px}
.hist span.on{background:var(--ink)}
.range{position:relative;height:30px}
.range .tr{position:absolute;left:13px;right:13px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#E3E3DF}
.range .fill{position:absolute;top:0;bottom:0;background:var(--ink);border-radius:3px}
.range input{position:absolute;inset:0;width:100%;margin:0;height:30px;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input::-webkit-slider-runnable-track{background:none;border:0}
.range input::-moz-range-track{background:none;border:0}
.range input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--lime);border:3px solid var(--ink);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--lime);border:3px solid var(--ink);cursor:grab}
.pboxes{display:flex;gap:8px;margin-top:8px}
.pbox{flex:1;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:9px 14px;box-shadow:var(--shadow);min-width:0}
.pbox span{color:var(--muted);font-size:.78rem;flex:none}
.pbox input{width:100%;min-width:0;font-weight:700;font-size:.95rem}
.fs-foot{display:flex;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.btn-ghost{background:var(--surface);border-radius:999px;padding:13px 18px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.btn-main{flex:1;background:var(--ink);color:#fff;border-radius:999px;padding:13px 18px;font-weight:700}

@media (max-width:520px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:7px;border-radius:22px}
  .pic{border-radius:17px}
  .body{padding:8px 4px 2px}
  .name{font-size:.86rem}
  .price{font-size:1.2rem}
  .lime-btn.sm{width:32px;height:32px;font-size:15px}
  .logo-name,.logo-store{font-size:1.15rem}
  .storetag{font-size:.66rem;padding:4px 7px}
  .badge{font-size:.74rem;padding:4px 8px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="logo" href="./"><span class="logo-mark"><i class="ph-bold ph-tag"></i></span><span class="logo-name">RevoSell</span><span class="logo-store" id="storeTitle"></span></a>
    <button class="burger" type="button" id="menuBtn" aria-label="Меню"><i class="ph-bold ph-list"></i></button>
  </header>

  <label class="search">
    <i class="ph ph-magnifying-glass"></i>
    <input id="q" type="search" autocomplete="off">
    <button class="lime-btn" type="button" id="sortBtn" aria-label="Фильтры"><i class="ph-bold ph-sliders-horizontal"></i><span class="fbadge" id="fbadge" hidden></span></button>
  </label>

  <nav class="chips" id="chips"></nav>
  <div class="count" id="count"></div>
  <section class="grid" id="grid"></section>
  <button class="more" type="button" id="more" hidden></button>
  <footer id="footer"></footer>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Меню">
  <div class="drawer-head">
    <b id="menuTitle"></b>
    <div class="lang" role="group" aria-label="Страна">
      <button type="button" data-country="tr">🇹🇷 TR</button>
      <button type="button" data-country="ru">🇷🇺 RU</button>
    </div>
    <button class="burger" type="button" id="closeBtn" aria-label="Закрыть"><i class="ph-bold ph-x"></i></button>
  </div>
  <div class="store-list" id="storeList"></div>
</aside>

<section class="fsheet" id="fsheet" role="dialog" aria-modal="true">
  <div class="fs-head"><b id="fsTitle"></b><button class="burger" type="button" id="fsClose" aria-label="×"><i class="ph-bold ph-x"></i></button></div>
  <div class="fs-body">
    <div class="fs-sec"><h4 id="fsSortT"></h4><div class="fs-chips line" id="fsSort"></div></div>
    <div class="fs-sec" id="fsPriceSec">
      <h4><span id="fsPriceT"></span></h4>
      <div class="hist" id="fsHist"></div>
      <div class="range"><div class="tr"><div class="fill" id="fsFill"></div></div><input type="range" id="fsLo" min="0" max="1000" step="1" aria-label="min"><input type="range" id="fsHi" min="0" max="1000" step="1" aria-label="max"></div>
      <div class="pboxes"><label class="pbox"><span id="fsFromT"></span><input id="fsMin" inputmode="decimal" autocomplete="off"></label><label class="pbox"><span id="fsToT"></span><input id="fsMax" inputmode="decimal" autocomplete="off"></label></div>
    </div>
    <div class="fs-sec"><h4 id="fsDiscT"></h4><div class="fs-chips line" id="fsDisc"></div></div>
    <div class="fs-sec"><h4 id="fsTypeT"></h4><div id="fsTypes"></div></div>
  </div>
  <div class="fs-foot"><button class="btn-ghost" type="button" id="fsReset"><i class="ph-bold ph-arrow-counter-clockwise"></i><span id="fsResetT"></span></button><button class="btn-main" type="button" id="fsShow"></button></div>
</section>

<script>
const I18N = {
  ru: {
    search: 'Найти товар или бренд…', menu: 'Магазины', allStores: 'Все магазины', all: 'Все акции', category: 'Все категории',
    deals: (n) => `${n.toLocaleString('ru-RU')} ${plural(n, ['акция', 'акции', 'акций'])}`,
    more: 'Показать ещё', empty: 'Ничего не найдено', error: 'Не удалось загрузить данные. Попробуйте позже.',
    sort: { disc: 'Выгодные', asc: 'Дешевле', desc: 'Дороже', fresh: 'Новые', name: 'А–Я', none: 'Как в магазине' },
    pricesIn: (c) => `цены: ${c}`,
    filters: 'Фильтры', sortT: 'Сортировка', price: 'Цена', from: 'от', to: 'до', discount: 'Скидка', anyDisc: 'Любая', discFrom: (n) => `от ${n}%`,
    type: 'Тип товара', food: 'Продукты', nonfood: 'Товары', pickAll: 'Выбрать все', unpickAll: 'Снять', clear: 'Сбросить', resetFilters: 'Сбросить фильтры',
    show: (n) => n ? `Показать ${n.toLocaleString('ru-RU')}` : 'Ничего не найдено',
    groups: { dairy: 'Молочное и яйца', meat: 'Мясо и рыба', produce: 'Овощи и фрукты', bakery: 'Хлеб и выпечка', staples: 'Бакалея', snacks: 'Сладости и снеки', drinks: 'Напитки', frozen: 'Заморозка', ready: 'Готовая еда',
      beauty: 'Красота и здоровье', cleaning: 'Бытовая химия', baby: 'Детям', home: 'Дом и кухня', tech: 'Техника', clothes: 'Одежда', hobby: 'Хобби, спорт, игрушки', pets: 'Животным', other: 'Другое' },
    types: { discount: 'Скидки %', card: 'С картой Money', multi: '2 по цене 1 и т.п.', basket: 'Цена в корзине', cashback: 'Кэшбэк Win', clearance: 'Распродажа', catalog: 'Migroskop', goodprice: 'İyi Fiyat', promo: 'Другие акции' },
    allTypes: { discount: 'Скидки %', card: 'С картой Money', multi: '2 по цене 1 и т.п.', basket: 'Цена в корзине', cashback: 'Кэшбэк', clearance: 'Распродажа', catalog: 'Каталог акций', goodprice: 'Выгодная цена', promo: 'Другие акции' },
    bimIndirim: 'Скидки İndirim', onSale: 'Уже в продаже', soon: 'Скоро', fresh: 'Новые', ekstra: 'Ekstra (техника, одежда)',
    money: 'С картой Money', loyalty: 'По карте лояльности', online: 'Только онлайн', newBadge: 'НОВОЕ',
    vv: { card: 'По карте', multi: 'При покупке от 2 шт', clearance: 'Исчезающий вид', online: 'Только онлайн' },
    startsIn: (n) => n <= 0 ? 'Начинается сегодня' : n === 1 ? 'Начнётся завтра' : `Начнётся через ${n} ${plural(n, ['день', 'дня', 'дней'])}`,
    endsIn: (n) => n <= 0 ? 'Последний день' : n === 1 ? 'Остался 1 день' : `Осталось ${n} ${plural(n, ['день', 'дня', 'дней'])}`,
    since: (d) => `В продаже с ${d}`, seenSince: (d) => `Акция с ${d}`, foundAgo: (t) => `Найдено ${t}`,
    ago: (m) => m < 1 ? 'только что' : m < 60 ? `${m} мин назад` : m < 1440 ? `${Math.floor(m / 60)} ч назад` : `${Math.floor(m / 1440)} дн назад`,
    every: (h) => h === 1 ? 'проверка каждый час' : h % 24 === 0 ? (h === 24 ? 'проверка раз в день' : `проверка раз в ${h / 24} дня`) : `проверка каждые ${h} ч`,
    updated: (t) => `обновлено ${t}`, stale: 'не обновилось — показаны прошлые данные',
    note: 'Цены и фото принадлежат магазинам; по клику открывается страница товара в магазине. У Migros скидочная цена действует с бесплатной картой Money. В магазине цена может отличаться, количество ограничено.',
    footer: 'Цены и фото принадлежат магазинам · убрать данные: bezzimeni17@gmail.com',
    locale: 'ru-RU',
  },
  tr: {

// Chips depend on the store. Each: [key, label, filter]; hidden when empty.
function chipDefs() {

    for (const per of (DATA.periods || []).filter((x) => x.section === 'aktuel' && x.validFrom).sort((a, b) => a.validFrom.localeCompare(b.validFrom)))
      defs.push(['pk:' + per.key, weekLabel(per.validFrom), (p) => p.pk === per.key]);

  const order = state.store === 'vkusvill' ? ['card', 'multi', 'clearance', 'online']

    : state.store === 'migros' ? ['card', 'multi', 'basket', 'clearance', 'catalog', 'goodprice', 'promo']
    : ['discount', 'card', 'multi', 'basket', 'cashback', 'clearance', 'catalog', 'goodprice', 'promo'];
  const labels = state.store === 'all' ? t.allTypes : t.types;
  const has = (k) => (k === 'online' ? (p) => p.on : k === 'card' ? (p) => p.t.includes('card') : (p) => p.t.includes(k));

// Green: updated on schedule; yellow: a check was missed; red: failed or long overdue.
function freshness(s) {

  return [level, `${T().updated(T().ago(m))} · ${T().every(s.every)}`];

function renderChips() {
  const defs = chipDefs();
  if (!defs.some((d) => d[0] === state.chip)) state.chip = 'all';
  const scope = DATA.products.filter(passes('chip')); // counts follow search and panel filters
  const tabs = [];
  for (const [key, label, f] of defs) {
    const n = scope.filter(f).length;
    // A chip that keeps every deal would just repeat "all".
    if (key === 'all' || key === state.chip || (n && n < scope.length)) tabs.push(chip(label, n, state.chip === key, () => { state.chip = key; state.shown = PAGE; render(); }));
  }
  $('chips').replaceChildren(...tabs);
}

function tagsFor(p) {
  const out = [], t = T(), today = todayIso();
  if (future(p)) out.push(['soon', 'clock', t.startsIn(daysBetween(today, p.vf))]);
  else if (p.vt) { const left = daysBetween(today, p.vt); out.push([left <= 1 ? 'end' : '', 'hourglass-medium', t.endsIn(left)]); }
  else if (p.vf) out.push(['', 'check-circle', t.since(dayLabel(p.vf))]);
  else if (p.fs) {
    out.push(['seen', 'clock-counter-clockwise', isNew(p) ? t.foundAgo(t.ago(minutesAgo(p.fs))) : t.seenSince(dayLabel(istDate(p.fs)))]);
  }
  if (p.m === 'money') out.push(['money', 'credit-card', t.money]);
  if (p.m === 'loyalty') out.push(['money', 'credit-card', t.loyalty]);
  if (p.on) out.push(['seen', 'globe', t.online]);
  for (const pr of p.pr || []) out.push(['promo', 'gift', pr]);
  return out;
}

// Every filter as a predicate; facets skip their own one, so each option in the

function passes(skip) {

  const { pmin, pmax, minDisc, groups } = state;
  return (p) => inStore(p) && f(p) && (!words.length || words.every((w) => p._f.includes(w)))
    && (skip === 'price' || ((pmin == null || p.p >= pmin) && (pmax == null || p.p <= pmax)))
    && (skip === 'disc' || !minDisc || (p.d || 0) >= minDisc)
    && (skip === 'groups' || !groups.size || groups.has(p.g || 'other'));

const activeFilters = () => (state.pmin != null || state.pmax != null) + !!state.minDisc + !!state.groups.size;

function render() {
  queueMicrotask(saveView); // after this render: remember chip/filters/search
  renderChips();
  const sorters = {
    none: () => 0,
    disc: (a, b) => (b.d || 0) - (a.d || 0) || b.t.length - a.t.length || a.p - b.p,
    fresh: (a, b) => (b.fs || '').localeCompare(a.fs || '') || (b.d || 0) - (a.d || 0),
    asc: (a, b) => a.p - b.p, desc: (a, b) => b.p - a.p,

function resetFilters() { state.pmin = state.pmax = null; state.minDisc = 0; state.groups.clear(); state.shown = PAGE; }

// Price slider on a log scale between the cheapest and dearest deal in view,
// with a histogram of the deals over the same scale.
let PR = { lo: 0, hi: 1, cur: 'TRY' };
const toPrice = (v) => PR.lo * Math.pow(PR.hi / PR.lo, v / 1000);
const toPos = (price) => Math.round(1000 * Math.log(price / PR.lo) / Math.log(PR.hi / PR.lo));

function renderPanel() {
  const t = T();
  const chipBtn = (label, ic, n, pressed, onclick) => {
    const b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', pressed);
    if (ic) b.append(icon(ic, 'ph-bold'));
    b.append(label);
    if (n != null) b.append(el('small', '', n.toLocaleString(t.locale)));
    b.onclick = onclick; return b;
  };
  // Sorting
  $('fsSort').replaceChildren(...SORTS.map((k) => chipBtn(t.sort[k], null, null, state.sort === k, () => { state.sort = k; store.set('sort', k); applyFilters(); })));
  // Discount: counts with every other filter applied
  const forDisc = DATA.products.filter(passes('disc'));
  $('fsDisc').replaceChildren(...DISCS.map((d) => {
    const n = d ? forDisc.filter((p) => (p.d || 0) >= d).length : forDisc.length;
    return d && !n && state.minDisc !== d ? null : chipBtn(d ? t.discFrom(d) : t.anyDisc, d ? 'percent' : null, n, state.minDisc === d, () => { state.minDisc = d; applyFilters(); });
  }).filter(Boolean));
  // Product types, food and non-food
  const forGroups = DATA.products.filter(passes('groups'));
  const counts = {}; for (const p of forGroups) counts[p.g || 'other'] = (counts[p.g || 'other'] || 0) + 1;
  const block = (title, keys) => {
    const shown = keys.filter((g) => counts[g] || state.groups.has(g));
    if (!shown.length) return [];
    const all = shown.every((g) => state.groups.has(g));
    const head = el('div', 'fs-sub'); head.append(el('span', '', title));
    const tog = el('button', '', all ? t.unpickAll : t.pickAll); tog.type = 'button';
    tog.onclick = () => { for (const g of shown) all ? state.groups.delete(g) : state.groups.add(g); applyFilters(); };
    head.append(tog);
    const box = el('div', 'fs-chips');
    box.append(...shown.map((g) => chipBtn(t.groups[g], GROUP_ICON[g], counts[g] || 0, state.groups.has(g), () => {
      state.groups.has(g) ? state.groups.delete(g) : state.groups.add(g); applyFilters();
    })));

  $('fsTypes').replaceChildren(...block(t.food, FOOD), ...block(t.nonfood, NONFOOD));
  if ($('fsTypes').firstChild) $('fsTypes').firstChild.style.marginTop = '0';
  renderPrice(DATA.products.filter(passes('price')));
  $('fsShow').textContent = t.show(current.length);
  $('fsShow').disabled = !current.length;
}

function renderPrice(list) {
  const prices = list.map((p) => p.p).filter((x) => x > 0);
  $('fsPriceSec').hidden = prices.length < 2;
  if (prices.length < 2) return;
  const lo = Math.max(0.5, niceNum(Math.min(...prices), false)), hi = niceNum(Math.max(...prices), true);
  PR = { lo, hi: Math.max(hi, lo * 1.01), cur: curOf() };
  const a = state.pmin == null ? 0 : Math.max(0, Math.min(1000, toPos(state.pmin)));
  const b = state.pmax == null ? 1000 : Math.max(0, Math.min(1000, toPos(state.pmax)));
  if (document.activeElement !== $('fsLo')) $('fsLo').value = a;
  if (document.activeElement !== $('fsHi')) $('fsHi').value = b;
  const BINS = 32, bins = new Array(BINS).fill(0);
  for (const x of prices) bins[Math.min(BINS - 1, Math.max(0, Math.floor(toPos(x) / 1000 * BINS)))]++;
  const max = Math.max(...bins);
  $('fsHist').replaceChildren(...bins.map((n, i) => {
    const bar = el('span', ((i + 0.5) / BINS * 1000 >= a && (i + 0.5) / BINS * 1000 <= b) ? 'on' : '');
    bar.style.height = (n ? 8 + 92 * Math.sqrt(n / max) : 0) + '%'; return bar;
  }));
  paintRange();
}
function paintRange() {
  const a = +$('fsLo').value, b = +$('fsHi').value;
  $('fsFill').style.left = a / 10 + '%'; $('fsFill').style.right = (100 - b / 10) + '%';
  const fmtP = (n) => new Intl.NumberFormat((CUR[PR.cur] || CUR.TRY)[0], { maximumFractionDigits: 2 }).format(n);
  if (document.activeElement !== $('fsMin')) $('fsMin').value = fmtP(state.pmin ?? PR.lo);
  if (document.activeElement !== $('fsMax')) $('fsMax').value = fmtP(state.pmax ?? PR.hi);
  $('fsMin').placeholder = fmtP(PR.lo); $('fsMax').placeholder = fmtP(PR.hi);
}
let slideTimer;
function onSlide(e) {
  let a = +$('fsLo').value, b = +$('fsHi').value;
  if (a > b) { if (e.target.id === 'fsLo') $('fsLo').value = a = b; else $('fsHi').value = b = a; }
  state.pmin = a <= 0 ? null : niceNum(toPrice(a), false);
  state.pmax = b >= 1000 ? null : niceNum(toPrice(b), true);
  paintRange();
  clearTimeout(slideTimer); slideTimer = setTimeout(applyFilters, 120);
}
function onPriceInput() {
  const num = (v) => { const n = parseFloat(String(v).replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return Number.isFinite(n) ? n : null; };
  let lo = num($('fsMin').value), hi = num($('fsMax').value);
  if (lo != null && hi != null && lo > hi) [lo, hi] = [hi, lo];
  state.pmin = lo == null || lo <= PR.lo ? null : lo;
  state.pmax = hi == null || hi >= PR.hi ? null : hi;
  $('fsMin').blur(); $('fsMax').blur();
  applyFilters();
}

function showMore() {
  const from = state.shown; state.shown += PAGE;
  $('grid').append(...current.slice(from, state.shown).map(card));
  $('more').hidden = current.length <= state.shown;
}

function setStore(id) {
  state.store = id !== 'all' && STORES[id] && (STORES[id].country || 'tr') === country ? id : 'all'; store.set('store', state.store);
  state.chip = 'all'; state.shown = PAGE;
  renderStatic(); window.scrollTo({ top: 0 });
  show();
}

// Downloads the deal files the current view needs (once each), then renders.
const countryStores = () => DATA.stores.filter((s) => (s.country || 'tr') === country);
const needed = () => (state.store === 'all' ? countryStores().map((s) => s.id) : [state.store]);
function load(id) {
  if (LOADED[id]) return LOADED[id];
  const s = STORES[id];
  return (LOADED[id] = fetch(`data/${s.file}?v=${s.v}`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((items) => {
      for (const p of items) { p.s = id; p._f = fold(`${p.n} ${p.b || ''} ${p.c || ''} ${s.name}`); }
      LOADED[id] = items;
      DATA.products = DATA.stores.flatMap((x) => (Array.isArray(LOADED[x.id]) ? LOADED[x.id] : []));
      return items;
    })
    .catch((e) => { delete LOADED[id]; throw e; }));
}
let showToken = 0;
function show() {
  const token = ++showToken;
  const ids = needed();
  if (ids.some((id) => !Array.isArray(LOADED[id]))) { $('count').textContent = ''; $('grid').replaceChildren(); $('chips').replaceChildren(); $('more').hidden = true; }
  Promise.all(ids.map(load)).then(() => {
    if (token !== showToken) return; // user switched store meanwhile
    renderMenu(); render();
    if (restoring) restoreScroll();
  }).catch(showError);
  // Warm the other stores in the background so switching is instant.
  if (state.store !== 'all') setTimeout(() => countryStores().forEach((x) => load(x.id)?.catch?.(() => {})), 1500);
}
function showError() { const e = el('div', 'empty'); e.append(icon('wifi-slash'), document.createTextNode(T().error)); $('grid').replaceChildren(e); }
const openMenu = () => document.body.classList.add('menu');
const closeMenu = () => document.body.classList.remove('menu', 'filters');

document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => {
  if (b.dataset.country === country) return;
  country = b.dataset.country; lang = LANG_OF[country]; store.set('country', country);
  state.pmin = state.pmax = null; // other currency
  setStore('all');
});
$('menuBtn').onclick = openMenu; $('closeBtn').onclick = closeMenu; $('scrim').onclick = closeMenu;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
$('sortBtn').onclick = (e) => {
  e.preventDefault(); if (!DATA) return;
  document.body.classList.add('filters'); renderPanel();
  // One-line rows open at the start, with the chosen chip in view.
  for (const row of document.querySelectorAll('.fs-chips.line')) { row.scrollLeft = 0; row.querySelector('[aria-pressed=true]')?.scrollIntoView({ inline: 'nearest', block: 'nearest' }); }
};
const closePanel = () => document.body.classList.remove('filters');
$('fsClose').onclick = closePanel; $('fsShow').onclick = () => { closePanel(); window.scrollTo({ top: 0 }); };
$('fsReset').onclick = () => { resetFilters(); state.sort = 'disc'; store.set('sort', 'disc'); render(); };
for (const id of ['fsLo', 'fsHi']) $(id).addEventListener('input', onSlide);
for (const id of ['fsMin', 'fsMax']) $(id).addEventListener('change', onPriceInput);
$('more').onclick = showMore;
let qTimer; $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { if (DATA && DATA.products.length) { state.shown = PAGE; render(); } }, 150); });
new IntersectionObserver((es) => { if (es[0].isIntersecting && !$('more').hidden) showMore(); }, { rootMargin: '600px' }).observe($('more'));
setInterval(() => { if (DATA) renderMenu(); }, 60000); // keep "N min ago" current

// Remember where the user was (store, chips, search, filters, scroll) so a
// reload — or the phone dropping the tab in the background — brings them back
// to the same product. The position is kept as "this card at this height",
// which survives images loading at different speeds.
const VIEW_KEY = 'view', VIEW_TTL = 12 * 36e5;
let restoring = null;
try { history.scrollRestoration = 'manual'; } catch {}
function saveView() {
  if (!DATA || restoring) return;
  let key = null, off = 0;
  if (scrollY > 40) {
    const cards = $('grid').children;
    for (let i = 0; i < cards.length; i++) {
      const r = cards[i].getBoundingClientRect();
      if (r.bottom > 70) { const p = current[i]; key = p && p.s + '|' + p.u; off = r.top; break; }
    }
  }
  store.set(VIEW_KEY, JSON.stringify({ t: Date.now(), country, store: state.store, chip: state.chip, q: $('q').value,
    pmin: state.pmin, pmax: state.pmax, minDisc: state.minDisc, groups: [...state.groups], shown: state.shown, key, off }));
}
function loadView() {
  let v; try { v = JSON.parse(store.get(VIEW_KEY)); } catch { return; }
  if (!v || Date.now() - v.t > VIEW_TTL || v.country !== country) return;
  state.store = v.store || state.store; state.chip = v.chip || 'all'; $('q').value = v.q || '';
  state.pmin = v.pmin ?? null; state.pmax = v.pmax ?? null; state.minDisc = v.minDisc || 0;
  state.groups = new Set(v.groups || []); state.shown = Math.max(PAGE, v.shown || PAGE);
  restoring = v;
}
function restoreScroll() {
  const v = restoring; restoring = null;
  if (!v.key) return;
  let i = current.findIndex((p) => p.s + '|' + p.u === v.key);
  if (i < 0) return; // that deal is gone: stay at the top
  if (i >= state.shown) { state.shown = Math.ceil((i + 1) / PAGE) * PAGE; render(); }
  const go = () => { const el = $('grid').children[i]; if (el) window.scrollTo(0, el.getBoundingClientRect().top + scrollY - v.off); };
  go(); requestAnimationFrame(go); setTimeout(go, 300); // again after fonts/layout settle
}
let saveTimer;
addEventListener('scroll', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveView, 250); }, { passive: true });
addEventListener('pagehide', saveView);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveView(); });
loadView();

renderStatic();
fetch('data/stores.json', { cache: 'no-cache' })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    DATA = { ...data, products: [] };
    for (const s of data.stores) STORES[s.id] = { every: 6, ...s };
    if (state.store !== 'all' && (!STORES[state.store] || (STORES[state.store].country || 'tr') !== country)) state.store = 'all';
    renderStatic(); show();
  })
  .catch(showError);
</script>
</body>
</html>
