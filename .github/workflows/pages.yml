name: Deploy site to GitHub Pages
# Crawls each store, validates the data, spot-checks it against product pages
# and publishes the site. A store that fails keeps its last published data;
# if no store has data nothing is deployed.
on:
  push:
    branches: [master]
  schedule:
    # Each store on its own rhythm (UTC). The repository is private, so runs
    # are kept inside the free Actions minutes (~55 min/day): BİM every 8 h,
    # ŞOK daily, Migros every 2 days. If the repo becomes public (unlimited
    # minutes) switch to: BİM '7 * * * *', ŞOK '17 */3 * * *', Migros
    # '27 */6 * * *'. Keep the strings in sync with the "Pick stores" step and
    # with "every" in scripts/build-site-data.js.
    - cron: '7 */8 * * *'
    - cron: '17 3 * * *'
    - cron: '27 4 */2 * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'Stores to crawl (comma separated)'
        default: 'bim,sok,migros'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # One crawl per store at a time; pushes replace each other.
  group: pages-${{ github.event_name == 'push' && 'push' || github.event.schedule || inputs.stores }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Pick stores
        id: pick
        if: github.event_name != 'push'
        run: |
          case "${{ github.event.schedule }}" in
            '7 */8 * * *')  echo "stores=bim" >> "$GITHUB_OUTPUT" ;;
            '17 3 * * *')   echo "stores=sok" >> "$GITHUB_OUTPUT" ;;
            '27 4 */2 * *') echo "stores=migros" >> "$GITHUB_OUTPUT" ;;
            *)              echo "stores=${{ inputs.stores || 'bim,sok,migros' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Crawl, verify and build data
        # Crawls the picked stores; the others keep their live data. A store
        # whose crawl or verification fails keeps its last published data.
        if: github.event_name != 'push'
        run: node scripts/update-all.js --only "${{ steps.pick.outputs.stores }}"
      - name: Reuse published data (code push)
        # A push only changes code/design: rebuild the site from the data that
        # is already live, so it is online in a minute.
        if: github.event_name == 'push'
        run: node scripts/update-all.js --reuse-published --only "${STORES}"
        env:
          STORES: bim,sok,migros
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
