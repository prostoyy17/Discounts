name: Deploy site to GitHub Pages
# Crawls each store, validates the data, spot-checks it against product pages
# and publishes the site. A store that fails keeps its last published data;
# if no store has data nothing is deployed.
on:
  push:
    branches: [master]
  schedule:
    # 06:12 and 18:12 Turkey time (UTC+3). BİM posts new catalogs on Tue/Fri.
    - cron: '12 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Crawl, verify and build data
        # Stores are added here only after they passed a full manual check.
        # A store whose crawl/verification fails keeps its last published data.
        run: node scripts/update-all.js --only "${STORES}"
        env:
          STORES: bim,sok,migros
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
